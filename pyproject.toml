[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rda-audit"
version = "0.2.4"
description = "Multi-surface consistency audit of software citation metadata"
authors = [{ name = "Pengyin Shan", email = "pengyins@illinois.edu" }]
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
    "rapidfuzz>=3.0",
    "pandas>=2.0",
    "matplotlib>=3.7",
]

[project.urls]
Homepage = "https://github.com/pengyin-shan/rda-audit-pipeline"
Repository = "https://github.com/pengyin-shan/rda-audit-pipeline"
Paper = "https://doi.org/10.48550/arXiv.2608.17159"
Archive = "https://doi.org/10.5281/zenodo.21969695"

[project.scripts]
rda-audit = "rda_audit.cli:main"

[tool.setuptools.packages.find]
include = ["rda_audit*"]
