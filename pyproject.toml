[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rda-audit"
version = "0.2.0"
description = "Multi-surface consistency audit of software citation metadata"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
    "rapidfuzz>=3.0",
    "pandas>=2.0",
    "matplotlib>=3.7",
]

[project.scripts]
rda-audit = "rda_audit.cli:main"

[tool.setuptools.packages.find]
include = ["rda_audit*"]
